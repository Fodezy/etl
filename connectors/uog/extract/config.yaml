# --- Pagination Selector ---
# The crawler will click this button to move to the next page of course results.
pagination_next_selector: 'button#course-results-next-page'

parser_rules:
  course:
    type: 'list'
    list_selector: 'li > div.esg-section--margin-top'
    extractors:
      full_title:    { css: 'h3 > span' }
      description:   { css: 'section > div.search-coursedatarow > div.search-coursedescription' }
      requisites:    { css: 'div.search-coursedataheader:contains("Requisites:") + div span[data-bind*="DisplayText"]' }
      offerings:     { css: 'div.search-coursedataheader:contains("Offering(s):") + div span' }
      restrictions:  { css: 'div.search-coursedataheader:contains("Restriction(s):") + div span' }
      departments:   { css: 'div.search-coursedataheader:contains("Department(s):") + div span' }
      location:      { css: 'div[data-bind*="LocationsDisplay"] span' }
      offered:       { css: 'div[data-bind*="showCourseOffering"] span' }

      # new: grab each term block
      sections:
        type: 'list'
        list_selector: 'div[data-bind="foreach: TermsAndSections"]'
        extractors:
          # the term header
          term_name: { css: 'h4' }

          # within each term, grab every <li> section
          sections:
            type: 'list'
            list_selector: 'ul[data-bind*="foreach: Sections"] > li.search-nestedaccordionitem'
            extractors:
              # e.g. "ACCT*1220*DE01"
              section_code: { css: 'a.search-sectiondetailslink' }

              # the section title beneath it
              section_name: { css: 'div.no-side-padding span' }

              # available seats text "67 / 250 / 0"
              seats: { css: 'span.search-seatsavailabletext' }

              # now dive into the meetings table
              meetings:
                type: 'list'
                list_selector: 'table.search-sectiontable > tbody > tr.search-sectionrow'
                extractors:
                  # e.g. days/times + dates
                  day_time:           { css: 'td.search-sectiondaystime' }
                  # e.g. building/room or "Distance Education"
                  location:           { css: 'td.search-sectionlocations' }
                  # instructor names + methods
                  instructor:         { css: 'td.search-sectioninstructormethods' }
